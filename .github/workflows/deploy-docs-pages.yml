name: Deploy Docs Website

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-docs-pages.yml"
      - "mmseqs2_docs/**"
      - "foldseek_docs/**"
      - "site/**"
      - "scripts/build_docs_web.sh"
      - "scripts/build_mmseqs_web.sh"
      - "scripts/build_foldseek_web.sh"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build static docs site
        run: bash scripts/build_docs_web.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
